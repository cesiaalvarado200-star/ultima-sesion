<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi lista de tareas</title>

    <!-- Conexión con CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- Encabezado principal -->
    <header class="contenedor">

        <div class="decoracion">✿</div>

        <h1>Mi lista de tareas</h1>

        <p class="subtitulo">
            Organiza tus actividades y cumple tus metas ♡
        </p>

        <!-- Contenido principal -->
        <main>

            <!-- Formulario para agregar tareas -->
            <section class="entrada" aria-label="Agregar una tarea">

                <input
                    type="text"
                    id="tarea"
                    placeholder="Escribe una nueva tarea..."
                    aria-label="Nombre de la tarea"
                >

                <button id="agregar" type="button">
                    + Agregar
                </button>

            </section>

            <!-- Sección de actividades -->
            <section aria-labelledby="titulo-actividades">

                <h2 id="titulo-actividades">
                    Mis actividades
                </h2>

                <ul id="listaTareas"></ul>

                <p id="mensaje" aria-live="polite"></p>

            </section>

        </main>

        <!-- Pie de página -->
        <footer class="pie">
            Hecho con cariño ♡
        </footer>

    </header>

    <!-- Conexión con JavaScript -->
    <script src="script.js"></script>

</body>

</html>
